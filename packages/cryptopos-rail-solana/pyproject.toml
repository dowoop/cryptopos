[project]
name = "cryptopos-rail-solana"
version = "0.1.0"
description = "A dependency-free Solana devnet SOL payment rail for CryptoPoS."
requires-python = ">=3.9"
# NOT EMPTY, and it was until 2026-08-31. This package imports
# `cryptopos_core.{addresses,errors,plugin,uri}` and declared nothing, so it
# installed cleanly into an environment where it could not run and only worked
# because the host happened to have core installed already. An undeclared
# dependency is the same defect class as D43's required field: the wheel a
# deployment actually installs is not the source the tests exercise.
#
# `>=1.1` rather than `==`: the plugin uses the PaymentRail protocol and the
# address/URI helpers, all of which are covered by the frozen API. A pin would
# make every core patch release a plugin release.
dependencies = ["cryptopos-core>=1.1"]

[project.entry-points."cryptopos.rails"]
solana-devnet-sol = "cryptopos_rail_solana:solana_devnet_sol"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cryptopos_rail_solana"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "pyproject.toml"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = ["E501", "W191"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
